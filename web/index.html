  <template id="tpl-sd">
    <section class="page">
      <h1>SD카드 준비</h1>
      <p class="lead">프로그래머는 FAT32 SD카드의 <code>/prog</code> 폴더에서 로더와 펌웨어를 읽습니다. 펌웨어 페이지의 <b>SD 패키지</b>를 받으면 아래 구조가 그대로 들어 있습니다.</p>
      <div class="cols">
        <ol class="steps">
          <li><b>SD 패키지(zip)</b>를 받아 <code>prog</code> 폴더를 카드 루트에 풉니다. 같은 프로젝트의 이전 버전은 덮어씁니다.</li>
          <li>카드에 로더가 없다면 아래 로더 파일을 직접 복사합니다. ST 라이선스 때문에 패키지에 포함하지 않습니다.</li>
          <li>카드를 프로그래머에 꽂고 홈의 <b>Flash</b>에서 프로젝트를 선택합니다.</li>
          <li>확인 화면에서 SEL을 놓았다가 1초 누릅니다. <code>Verified</code>가 표시되면 완료입니다.</li>
        </ol>
        <pre class="tree">/prog/
├── loaders/
│   └── st/
│       └── 0x483.stldr     <span>← 직접 복사</span>
├── fw/
│   └── &lt;프로젝트 ID&gt;/
│       ├── fw.txt
│       └── app.bin
└── README.txt</pre>
      </div>
      <h2>로더</h2>
      <div id="loaders"></div>
    </section>
  </template>

  <template id="tpl-api">
    <section class="page">
      <h1>기기 API</h1>
      <p class="lead">LTE 모듈이 붙은 프로그래머가 읽을 고정 경로입니다. 모두 정적 파일이며 GET 요청만 사용합니다. 리다이렉트가 없는 Pages 경로라 모뎀 HTTP 스택에서도 그대로 받을 수 있습니다.</p>
      <div class="endpoints">
        <article class="endpoint">
          <header><span class="method">GET</span><code data-url="fw/&lt;id&gt;/latest.txt"></code></header>
          <p>프로젝트의 최신 정식 버전입니다. 프리릴리스는 제외됩니다. <code>fw.txt</code>와 같은 <code>key=value</code> 형식이라 펌웨어의 기존 파서로 읽을 수 있습니다. 경로는 사이트 루트 기준입니다.</p>
          <pre id="latest-sample" class="code"></pre>
        </article>
        <article class="endpoint">
          <header><span class="method">GET</span><code data-url="manifest.json"></code></header>
          <p>칩, 로더, 프로젝트, 전체 버전 목록입니다. 이 사이트도 같은 파일을 렌더링합니다. <code>schema</code>가 바뀌면 호환되지 않는 변경입니다.</p>
        </article>
        <article class="endpoint">
          <header><span class="method">GET</span><code data-url="fw/&lt;id&gt;/&lt;version&gt;/{app.bin, fw.txt}"></code></header>
          <p>버전 폴더는 게시한 뒤 바뀌지 않습니다. 받은 BIN은 <code>size</code>, <code>crc32</code>, <code>sha256</code>로 검증한 다음 SD에 반영합니다.</p>
        </article>
      </div>
      <h2>권장 업데이트 순서</h2>
      <ol class="steps">
        <li><code>latest.txt</code>를 받아 SD의 현재 버전과 비교합니다.</li>
        <li>새 BIN과 <code>fw.txt</code>를 <code>/prog/.staging/&lt;id&gt;/</code>에 받습니다.</li>
        <li>크기, CRC32, SHA-256을 확인합니다. 하나라도 다르면 버립니다.</li>
        <li>기존 폴더를 백업 이름으로 바꾸고, staging 폴더를 <code>/prog/fw/&lt;id&gt;/</code>로 바꿉니다. 기록 작업 중에는 교체하지 않습니다.</li>
      </ol>
    </section>
  </template>
